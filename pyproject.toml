[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[project]
name = "cantcp"
version = "0.1.2"
description = "Python library for the cantcp protocol: Linux SocketCAN framing with CRC-8 and a CAN / CAN FD frame model"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stepanov Mikhail", email = "stepanov.mikhail.y@gmail.com" }]
keywords = ["can", "can-fd", "socketcan", "cantcp", "crc8", "telemetry", "protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://burn-lab.ru"
Repository = "https://github.com/burn-lab-dev/cantcp-lib-python"
Issues = "https://github.com/burn-lab-dev/cantcp-lib-python/issues"
Changelog = "https://github.com/burn-lab-dev/cantcp-lib-python/releases"

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.12",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "ANN", # flake8-annotations
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "FLY", # flynt
  "FURB",# refurb
  "I",   # isort
  "PERF",# perflint
  "PIE", # flake8-pie
  "PTH", # flake8-use-pathlib
  "RUF", # ruff-specific rules
  "S",   # flake8-bandit
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
ignore = [
  "D107", # missing docstring in __init__: the class docstring covers it
  "D203", # one-blank-line-before-class: conflicts with D211
  "D213", # multi-line-summary-second-line: conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "S"]
"scripts/**" = ["ANN", "D", "S"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
python_version = "3.10"

[tool.pytest.ini_options]
addopts = ["--doctest-modules", "--cov", "--cov-branch", "--cov-report=term-missing"]
testpaths = ["tests", "src/cantcp"]

[tool.coverage.run]
branch = true
source = ["cantcp"]

[tool.coverage.report]
fail_under = 100
show_missing = true
