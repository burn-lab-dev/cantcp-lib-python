name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: uv lock check
        run: uv lock --check
      - name: uv sync
        run: uv sync --all-groups
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest

  canon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the vectors against the canon
        run: |
          python3 scripts/sync_vectors.py --check \
            --url https://raw.githubusercontent.com/burn-lab-dev/cantcp-spec/main/vectors.json
      - name: Verify the local checksum
        run: (cd tests && sha256sum -c vectors.sha256)

  properties:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
      - name: uv sync
        run: uv sync --all-groups
      - name: hypothesis property tests
        run: uv run pytest tests/test_properties.py --no-cov -q
