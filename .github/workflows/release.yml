name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # The release build must be reproducible: no floating uv.
          version: "0.13.7"
      - name: Check that the package version matches the tag
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "pyproject version $version does not match the tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI
        run: uv publish
